<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Trinova account password.">
  <title>Reset Password · Trinova Cyber Awareness 360</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/features.css">
  <link rel="stylesheet" href="./css/auth.css">

  <script>
    // Public page: signed-in users bounce to their dashboard
    window.PAGE_AUTH = { public: true };
  </script>
  <script src="./js/auth-guard.js" defer></script>
</head>
<body class="auth-page">

  <main class="auth-shell">
    <a class="auth-home" href="./index.html">&larr; Back to Trinova home</a>
    <div class="auth-head">
      <img class="auth-logo" src="./assets/images/logo.png" alt="Trinova">
      <h1 id="page-title">Forgot your password?</h1>
      <p class="auth-sub" id="page-sub">Enter your account email and we'll issue a one-time reset link valid for 15 minutes.</p>
    </div>

    <div class="auth-body">
      <!-- Step 1: request a reset link -->
      <form id="form-forgot" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Account email</label>
          <input type="email" id="forgot-email" name="email" required autocomplete="email"
                 placeholder="you@company.com">
        </div>
        <div id="forgot-error-msg" class="auth-error-msg"></div>
        <div id="forgot-success-msg" class="auth-success-msg"></div>
        <div class="reset-token-box" id="reset-link-box" style="display:none;"></div>
        <button type="submit" class="btn-primary btn-block" id="btn-forgot-submit">Send Reset Link →</button>
      </form>

      <!-- Step 2: choose a new password (when ?token= is present) -->
      <form id="form-reset" class="auth-form" novalidate style="display:none;">
        <div class="form-group">
          <label for="reset-password">New password</label>
          <input type="password" id="reset-password" required autocomplete="new-password"
                 placeholder="Enter a new password">
          <div class="pwd-meter" id="pwd-meter" data-score="0">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="form-hint" id="pwd-rules">8+ characters · letter · number · symbol</div>
        </div>
        <div class="form-group">
          <label for="reset-confirm">Confirm new password</label>
          <input type="password" id="reset-confirm" required autocomplete="new-password"
                 placeholder="Repeat the new password">
        </div>
        <div id="reset-error-msg" class="auth-error-msg"></div>
        <button type="submit" class="btn-primary btn-block" id="btn-reset-submit">Update Password →</button>
      </form>

      <div class="auth-foot">
        <a href="./login.html">← Back to sign in</a>
        &nbsp;·&nbsp;
        No account yet? <a href="./register.html">Create one</a>
      </div>
      <div class="auth-legal">
        Resetting a password revokes every active session for that account.
      </div>
    </div>
  </main>

  <script>
    (function () {
      const forgotForm = document.getElementById('form-forgot');
      const resetForm = document.getElementById('form-reset');
      const forgotError = document.getElementById('forgot-error-msg');
      const forgotSuccess = document.getElementById('forgot-success-msg');
      const resetError = document.getElementById('reset-error-msg');
      const linkBox = document.getElementById('reset-link-box');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      function validatePassword(pwd) {
        if (pwd.length < 8) return 'Password must be at least 8 characters long.';
        if (!/[A-Za-z]/.test(pwd)) return 'Password must contain at least one letter.';
        if (!/[0-9]/.test(pwd)) return 'Password must contain at least one number.';
        if (!/[^A-Za-z0-9]/.test(pwd)) return 'Password must contain at least one symbol.';
        return null;
      }

      // ---- Reset step (token in URL) ----
      if (token) {
        document.getElementById('page-title').textContent = 'Choose a new password';
        document.getElementById('page-sub').textContent =
          'Enter a new password for your account. All existing sessions will be signed out.';
        forgotForm.style.display = 'none';
        resetForm.style.display = 'block';

        const pwdEl = document.getElementById('reset-password');
        const meter = document.getElementById('pwd-meter');
        const rulesEl = document.getElementById('pwd-rules');
        pwdEl.addEventListener('input', () => {
          const pwd = pwdEl.value;
          let score = 0;
          if (pwd.length >= 8) score++;
          if (pwd.length >= 12) score++;
          if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
          if (/[^A-Za-z0-9]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
          meter.dataset.score = pwd ? String(Math.min(score, 4)) : '0';
          const err = pwd ? validatePassword(pwd) : null;
          rulesEl.textContent = err || (pwd ? 'Password looks good.' : '8+ characters · letter · number · symbol');
          rulesEl.className = 'form-hint ' + (pwd ? (err ? 'error' : 'ok') : '');
        });

        resetForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          resetError.textContent = '';
          const pwd = pwdEl.value;
          const confirm = document.getElementById('reset-confirm').value;
          const err = validatePassword(pwd);
          if (err) { resetError.textContent = err; return; }
          if (pwd !== confirm) { resetError.textContent = 'Passwords do not match.'; return; }

          const btn = document.getElementById('btn-reset-submit');
          btn.disabled = true;
          btn.textContent = 'Updating…';
          try {
            const res = await fetch('/api/auth/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ token, password: pwd })
            });
            const data = await res.json();
            if (res.ok && data.success) {
              try { localStorage.removeItem('cybersafe_auth_user'); } catch (e) {}
              window.location.replace('./login.html');
              return;
            }
            resetError.textContent = data.error || 'Could not reset the password.';
          } catch (e) {
            resetError.textContent = 'Server connection error. Please try again.';
          } finally {
            btn.disabled = false;
            btn.textContent = 'Update Password →';
          }
        });
        return;
      }

      // ---- Request step ----
      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        forgotError.textContent = '';
        forgotSuccess.classList.remove('visible');
        linkBox.style.display = 'none';

        const email = document.getElementById('forgot-email').value.trim();
        if (!email) { forgotError.textContent = 'Please enter your account email.'; return; }

        const btn = document.getElementById('btn-forgot-submit');
        btn.disabled = true;
        btn.textContent = 'Issuing link…';
        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            forgotSuccess.textContent = 'If that email exists, a reset link has been issued (valid 15 minutes).';
            forgotSuccess.classList.add('visible');
            if (data.resetUrl) {
              // Local prototype: no mail server, so surface the one-time link directly.
              linkBox.innerHTML =
                'Demo mode (no mail server): <a href="' + data.resetUrl + '">open your reset link</a>';
              linkBox.style.display = 'block';
            }
          } else {
            forgotError.textContent = data.error || 'Could not start the password reset.';
          }
        } catch (e) {
          forgotError.textContent = 'Server connection error. Please try again.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link →';
        }
      });
    })();
  </script>
</body>
</html>
